# mail-code-service · 单实例部署（M8 / 需求 §10.5）
# 容量=账号数（C-2），有状态调度核心 + IMAP 长连接必须单进程持有（C-7）——
# 故单实例，不横向扩展；data/ 走 named volume 持久化（重启恢复 C-6）。

services:
  mail-code-service:
    build: .
    image: mail-code-service:latest
    container_name: mail-code-service
    restart: unless-stopped
    init: true # 回收 Chromium 子进程（与镜像内 tini 双保险）
    ports:
      - '8080:8080'
    env_file:
      - .env
    volumes:
      - mcs-data:/app/data # SQLite + 会话缓存，勿留容器可写层
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mcs-data:
