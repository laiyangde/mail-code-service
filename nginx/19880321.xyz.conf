# mail-code-service · Nginx 反向代理（生产）
# 站点：19880321.xyz —— TLS 终止 + 反代到本机 App 容器（127.0.0.1:8080）。
#
# 关键点：
# - 本服务重度依赖 SSE（收码实时推送 /api/public/leases/:id/stream），故 proxy_buffering
#   必须 off、读超时拉长，否则前端收不到实时邮件；
# - 传递真实客户端 IP（X-Forwarded-For / X-Real-IP），配合 App 的 TRUST_PROXY 使限流按真实 IP；
# - 首次签发证书前请先用 bootstrap-http.conf（仅 80）跑通 ACME，再启用本文件的 443（见部署文档 §6）。
#
# 安装：软链到 /etc/nginx/conf.d/ 或 /etc/nginx/sites-enabled/，nginx -t && systemctl reload nginx

upstream mail_code_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── HTTP(80)：ACME 验证放行 + 其余强制跳转 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name 19880321.xyz;

    # Let's Encrypt HTTP-01 挑战（acme.sh --webroot /var/www/acme）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443)：TLS 终止 + 反代 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 19880321.xyz;

    # 证书由 acme.sh --install-cert 安装到此路径（续期后自动 reload，见部署文档 §6）
    ssl_certificate     /etc/nginx/ssl/19880321.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/19880321.xyz/key.pem;

    # 现代 TLS 基线
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头（补齐点击劫持/嗅探/引用者防护；邮件正文已在前端 iframe sandbox 隔离）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # 确认全站 HTTPS 稳定后再启用 HSTS（启用后浏览器会记住，勿在未就绪时开）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;   # 取码/管理请求体都很小

    # gzip 常规文本（SSE 的 text/event-stream 不在列表内，不会被压缩缓冲）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://mail_code_app;
        proxy_http_version 1.1;

        # 真实客户端 IP（App 侧 TRUST_PROXY 据此取，限流按真实 IP）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE 必需：关缓冲、清 Connection、拉长读超时 ──
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;   # SSE 长连接（收码等待期）不被中途掐断
        proxy_send_timeout 3600s;
    }
}
