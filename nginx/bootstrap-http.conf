# mail-code-service · Nginx 引导配置（仅 80，用于首次签发证书 / 无证书时先跑通 HTTP）
#
# 用途：证书是"鸡生蛋"——443 需要证书，而签证书又需要 80 能被 ACME 访问。
# 首次部署时先启用本文件（仅 80），跑通 ACME 签发后，再切换到 19880321.xyz.conf（含 443）。
#
# 安装：软链到 /etc/nginx/conf.d/，nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 19880321.xyz;

    # Let's Encrypt HTTP-01 挑战目录
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 无证书阶段直接反代到 App（可先用 http://19880321.xyz 验证服务是否正常）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
